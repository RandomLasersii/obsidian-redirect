<!DOCTYPE html>
<html>
<head>
  <title>Opening Obsidian...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    window.onload = function() {
      const search = window.location.search;
      const prefixIndex = search.indexOf("?url=");
      const target = prefixIndex !== -1 ? decodeURIComponent(search.slice(prefixIndex + 5)) : null;
      const vaultName = "Jackpot";
      
      const allowedPrefixes = [
        `obsidian://open?vault=${vaultName}`,
        `obsidian://new?vault=${vaultName}`,
        `obsidian://adv-uri?vault=${vaultName}`
      ];

      const isAllowed = target && allowedPrefixes.some(prefix => target.startsWith(prefix));
      const linkElement = document.getElementById("manual-link");

      if (isAllowed) {
        linkElement.href = target;
        linkElement.textContent = "Click here to open in Obsidian";
        window.location.href = target;
      } else {
        document.getElementById("status").textContent = "Blocked: Invalid or unauthorized Obsidian link.";
        linkElement.style.display = "none";
      }
    };
  </script>
</head>
<body style="font-family: sans-serif; padding: 2rem;">
  <p id="status">Opening note in Obsidian...</p>
  <p><a id="manual-link" href="#">Loading link...</a></p>
</body>
</html>
