<!DOCTYPE html>
<html>
<head>
  <title>Opening Obsidian...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get("url");
    const vaultName = "YourVaultName";
    
    const allowedPrefixes = [
      `obsidian://open?vault=${vaultName}`,
      `obsidian://new?vault=${vaultName}`
    ];

    const isAllowed = target && allowedPrefixes.some(prefix => target.startsWith(prefix));

    if (isAllowed) {
      window.location.replace(target);
      setTimeout(() => window.close(), 1500);
    } else {
      document.body.innerHTML = "<p>Blocked: Invalid or unauthorized Obsidian link.</p>";
    }
  </script>
</head>
<body>
  <p>Opening note in Obsidian...</p>
</body>
</html>
